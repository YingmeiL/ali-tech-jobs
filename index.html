{"b": "钉钉", "n": "钉钉-嵌入式开发工程师-杭州", "l": "杭州", "u": "https://talent.dingtalk.com/off-campus/position-detail?positionId=100006840001", "c": "钉钉", "t": "硬件/嵌入式"},

{"b": "钉钉", "n": "钉钉-语音算法-工程师/专家", "l": "杭州", "u": "https://talent.dingtalk.com/off-campus/position-detail?positionId=100010200025", "c": "钉钉", "t": "语音/音频"}
];

const TECH_CSS = {
  'AI Agent': 'bt-ai-agent', '视觉/多模态': 'bt-vision', '语音/音频': 'bt-speech',
  '具身智能': 'bt-embodied', 'NLP/大模型': 'bt-nlp', '后端开发': 'bt-backend',
  '前端/客户端': 'bt-frontend', '数据': 'bt-data', '测试/质量': 'bt-test',
  '运维/SRE': 'bt-devops', '安全': 'bt-security', '云平台/基础设施': 'bt-cloud',
  '硬件/嵌入式': 'bt-hardware', '算法': 'bt-algorithm', '其他': 'bt-other'
};

const companies = ['全部', '淘天集团', '高德地图', '阿里云', '夸克', '钉钉'];
let activeCompany = '全部';
let activeTech = '';

// Company tabs
const tabsEl = document.getElementById('tabs');
companies.forEach(c => {
  const cnt = c === '全部' ? DATA.length : DATA.filter(d => d.c === c).length;
  const div = document.createElement('div');
  div.className = 'tab' + (c === '全部' ? ' active' : '');
  div.dataset.company = c;
  div.innerHTML = c + '<span class="cnt">(' + cnt + ')</span>';
  div.addEventListener('click', () => {
    activeCompany = c;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    div.classList.add('active');
    document.getElementById('companyFilter').value = c === '全部' ? '' : c;
    render();
  });
  tabsEl.appendChild(div);
});

// Company stats
const csEl = document.getElementById('companyStats');
companies.forEach((c, ci) => {
  const cnt = c === '全部' ? DATA.length : DATA.filter(d => d.c === c).length;
  const card = document.createElement('div');
  card.className = 'stat-card';
  card.style.animationDelay = (ci * 0.06) + 's';
  card.innerHTML = '<div class="num">' + cnt + '</div><div class="label">' + (c === '全部' ? '总计' : c) + '</div>';
  card.addEventListener('click', () => {
    activeCompany = c;
    document.getElementById('companyFilter').value = c === '全部' ? '' : c;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.company === c));
    render();
  });
  csEl.appendChild(card);
});

// Tech direction stats
const techOrder = ['AI Agent','视觉/多模态','语音/音频','具身智能','NLP/大模型','算法','后端开发','前端/客户端','数据','测试/质量','运维/SRE','安全','云平台/基础设施','硬件/嵌入式','其他'];
const tsEl = document.getElementById('techStats');
techOrder.forEach((t, ti) => {
  const cnt = DATA.filter(d => d.t === t).length;
  if (cnt === 0) return;
  const card = document.createElement('div');
  card.className = 'stat-card';
  card.dataset.tech = t;
  card.style.animationDelay = (ti * 0.04) + 's';
  card.innerHTML = '<div class="num">' + cnt + '</div><div class="label">' + t + '</div>';
  card.addEventListener('click', () => {
    if (activeTech === t) { activeTech = ''; card.classList.remove('active'); }
    else { activeTech = t; document.querySelectorAll('#techStats .stat-card').forEach(c => c.classList.remove('active')); card.classList.add('active'); }
    document.getElementById('techFilter').value = activeTech;
    render();
  });
  tsEl.appendChild(card);
});

// Build filter dropdowns
const bizSet = new Set(); const locSet = new Set();
DATA.forEach(d => { bizSet.add(d.b); d.l.split(' / ').forEach(loc => locSet.add(loc.trim())); });
const companySelect = document.getElementById('companyFilter');
const techSelect = document.getElementById('techFilter');
const bizSelect = document.getElementById('bizFilter');
const locSelect = document.getElementById('locFilter');
companies.slice(1).forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; companySelect.appendChild(o); });
techOrder.forEach(t => { const cnt = DATA.filter(d => d.t === t).length; if (cnt === 0) return; const o = document.createElement('option'); o.value = t; o.textContent = t + ' (' + cnt + ')'; techSelect.appendChild(o); });
Array.from(bizSet).sort().forEach(b => { const o = document.createElement('option'); o.value = b; o.textContent = b; bizSelect.appendChild(o); });
Array.from(locSet).sort().forEach(l => { const o = document.createElement('option'); o.value = l; o.textContent = l; locSelect.appendChild(o); });

function render() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const company = companySelect.value;
  const tech = techSelect.value;
  const biz = bizSelect.value;
  const loc = locSelect.value;
  const filtered = DATA.filter(d => {
    if (q && !d.n.toLowerCase().includes(q) && !d.b.toLowerCase().includes(q) && !d.c.toLowerCase().includes(q) && !d.t.toLowerCase().includes(q)) return false;
    if (company && d.c !== company) return false;
    if (tech && d.t !== tech) return false;
    if (biz && d.b !== biz) return false;
    if (loc && !d.l.includes(loc)) return false;
    return true;
  });
  document.getElementById('countLabel').textContent = '共 ' + filtered.length + ' 个职位' + (filtered.length < DATA.length ? '（已筛选）' : '');
  document.getElementById('tbody').innerHTML = filtered.map((d, i) =>
    '<tr><td class="idx">' + (i+1) + '</td><td><span class="badge badge-co">' + d.c + '</span></td><td><span class="badge ' + (TECH_CSS[d.t]||'bt-other') + '">' + d.t + '</span></td><td><span class="badge badge-biz">' + d.b + '</span></td><td>' + d.n + '</td><td>' + d.l + '</td><td><a href="' + d.u + '" target="_blank">投递</a></td></tr>'
  ).join('');
}
document.getElementById('searchInput').addEventListener('input', render);
companySelect.addEventListener('change', function() {
  activeCompany = this.value || '全部';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.company === activeCompany));
  render();
});
techSelect.addEventListener('change', function() {
  activeTech = this.value;
  document.querySelectorAll('#techStats .stat-card').forEach(c => c.classList.toggle('active', c.dataset.tech === activeTech));
  render();
});
bizSelect.addEventListener('change', render);
locSelect.addEventListener('change', render);
render();
</script>
